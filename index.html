<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Electron Hello World</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background: #fafafa;
      }
      .card {
        text-align: center;
        border: 1px solid #ddd;
        border-radius: 12px;
        padding: 32px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        background: white;
      }
      h1 {
        margin: 0 0 16px;
        color: #222;
      }
      p {
        margin: 0;
        color: #555;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Hello World</h1>
      <p>Welcome to your Electron app.</p>
      <p id="preload-message"></p>
    </div>

    <script>
      const message = window.electronAPI?.hello?.();
      document.getElementById('preload-message').textContent = message || '';
    </script>
  </body>
</html>
